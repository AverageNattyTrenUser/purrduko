<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1b33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Purrdoku">
<title>Purrdoku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#1d1b33; --panel:#2a2748; --panel-2:#352f5b; --panel-3:#43397a;
    --ink:#efeaff; --muted:#a9a2d1; --moon:#ffd166; --line:#2b2330; --bad:#ff7b8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
  body{background:radial-gradient(900px 420px at 50% -8%, #3a3470 0%, transparent 62%), var(--bg)}
  button,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:var(--panel-2);border-radius:14px;font-weight:700;transition:transform .08s ease, background .15s ease}
  @media (hover:hover){ button:hover{background:var(--panel-3)} }
  button:active{transform:scale(.95)}
  button:focus-visible,.cell:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default;transform:none}

  /* ---------- layout ---------- */
  .app{
    height:100vh;height:100dvh;max-width:600px;margin:0 auto;
    display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"top" "stats" "board" "bottom";
    gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px)
            calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px);
  }
  .top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .tl{display:flex;gap:8px;justify-self:start}.tr{justify-self:end}
  .icon-btn{width:48px;height:48px;padding:0;font-size:1.25rem;display:grid;place-items:center;background:var(--panel)}
  .lvl{text-align:center;line-height:1.15}
  .lvl-num{font-size:1.45rem;font-weight:800;letter-spacing:.2px;font-variant-numeric:tabular-nums}
  .lvl-sub{margin-top:3px;font-size:.85rem;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
  .chip{padding:2px 8px;border-radius:999px;font-weight:800;font-size:.75rem;color:#241f3d}
  .chip.easy{background:#7ee0b0}.chip.medium{background:#ffd166}.chip.hard{background:#ff9f6b}.chip.expert{background:#d6a6ff}.chip.free{background:#9bbcf0}

  .stats{grid-area:stats;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--panel);border-radius:14px;padding:7px 6px;text-align:center}
  .stat b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
  .stat span{font-size:.72rem;color:var(--muted)}
  .hearts{letter-spacing:1px}
  .hearts .gone{opacity:.22;filter:grayscale(1)}

  .boardarea{grid-area:board;position:relative;container-type:size;display:grid;place-items:center;min-height:0}
  .board{
    --s:calc(min(100cqw, 100cqh) - 8px);
    width:var(--s);height:var(--s);max-width:560px;max-height:560px;
    display:grid;border-radius:12px;overflow:hidden;touch-action:none;background:#000;
    box-shadow:0 12px 36px rgba(0,0,0,.45), 0 0 0 4px var(--panel);
  }
  @supports not (width:1cqw){ .board{--s:min(92vw, 56vh)} }
  .cell{position:relative;display:flex;align-items:center;justify-content:center;border-style:solid;color:var(--line);font-weight:800;line-height:1}
  .cell .x{font-size:calc(min(var(--s),560px) / var(--n) * .42);opacity:.75;pointer-events:none}
  .cell .x.auto{opacity:.26}
  .cell svg.cat{width:80%;height:80%;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18));animation:pop .2s ease-out}
  .cell.flash{animation:flash .9s ease}
  .cell.shake{animation:shake .35s ease}
  .board.won .cell svg.cat,.demo.won .cell svg.cat{animation:hop .6s ease-in-out infinite alternate}
  .board.won .cell:nth-child(odd) svg.cat,.demo.won .cell:nth-child(odd) svg.cat{animation-delay:.15s}
  @keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
  @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10%)}}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  @keyframes flash{0%,60%{box-shadow:inset 0 0 0 4px var(--moon)}100%{box-shadow:inset 0 0 0 0 transparent}}
  .gen{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-weight:700}
  .gen.show{display:grid}
  .gen span{background:var(--panel);padding:10px 16px;border-radius:12px}

  .bottom{grid-area:bottom;display:flex;flex-direction:column;gap:8px}
  .toolrow{display:flex;gap:8px}
  .seg{flex:1;display:flex;background:var(--panel);border-radius:16px;padding:4px;gap:4px}
  .seg button{flex:1;min-height:46px;white-space:nowrap;background:transparent;border-radius:12px;font-size:.95rem}
  .seg button[aria-pressed="true"]{background:var(--moon);color:#2b2330}
  .restart{min-width:56px;min-height:54px;font-size:1.2rem;background:var(--panel)}
  .powers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .power{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;position:relative}
  .power .ico{font-size:1.35rem;line-height:1}
  .power .lbl{font-size:.74rem;line-height:1.1}
  .power .inf{position:absolute;top:3px;right:7px;font-size:.78rem;color:var(--moon)}

  /* short landscape phones: board left, controls right */
  @media (orientation:landscape) and (max-height:540px){
    .app{max-width:none;grid-template-columns:minmax(0,1fr) minmax(240px,300px);
      grid-template-rows:auto auto minmax(0,1fr) auto;
      grid-template-areas:"board top" "board stats" "board ." "board bottom";gap:8px}
    .icon-btn{width:42px;height:42px}
    .lvl-num{font-size:1.2rem}
    .stat{padding:5px 4px}.stat b{font-size:1rem}
    .seg button{min-height:40px;font-size:.82rem}.restart{min-height:48px}
    .power{min-height:48px}.power .lbl{font-size:.68rem}
  }
  /* very small phones */
  @media (max-height:640px) and (orientation:portrait){
    .app{gap:7px}
    .lvl-num{font-size:1.25rem}
    .stat{padding:5px 4px}.stat b{font-size:1rem}
    .power{min-height:52px}.power .lbl{font-size:.68rem}
    .seg button{min-height:40px}.restart{min-height:48px}
  }


  /* ---------- animated tutorial ---------- */
  .tutmodal{max-width:420px;padding:14px 16px 14px}
  .tuthead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .tuthead .step{color:var(--muted);font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:left}
  .tuthead h2{flex:1;margin:0;font-size:1.2rem;text-align:left}
  .tuthead button{width:42px;height:42px;padding:0;font-size:1rem}
  .tutstage{position:relative;display:flex;justify-content:center;margin:0 auto 10px}
  .demo{--s:min(68vw,34dvh,290px);--n:5;width:var(--s);height:var(--s);display:grid;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--panel-2)}
  .demo .cell{cursor:default}
  .cell.hl::after,.cell.bad::after{content:"";position:absolute;inset:0;pointer-events:none;animation:pulse .5s ease-in-out infinite alternate}
  .cell.hl::after{box-shadow:inset 0 0 0 3px #fff;background:rgba(255,255,255,.18)}
  .cell.bad::after{box-shadow:inset 0 0 0 3px var(--bad);background:rgba(255,123,138,.3)}
  @keyframes pulse{from{opacity:.4}to{opacity:1}}
  .cell .x.wrong{color:#d23a52;opacity:1}
  .finger{position:absolute;left:0;top:0;font-size:34px;line-height:1;pointer-events:none;opacity:0;z-index:3;
    transition:transform .5s cubic-bezier(.3,.7,.3,1),opacity .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
  .finger span{display:block;transition:transform .1s}
  .finger.fast{transition:transform .16s linear,opacity .2s}
  .finger.press span{transform:scale(.78)}
  .ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;pointer-events:none;z-index:2;animation:ripple .5s ease-out forwards}
  @keyframes ripple{from{transform:scale(.3);opacity:.95}to{transform:scale(1.35);opacity:0}}
  .tutstart{position:absolute;inset:0;display:none;place-items:center;z-index:4}
  .tutstart.show{display:grid}
  .tutstart button{min-height:56px;padding:0 22px;font-size:1.05rem;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .tutextra{display:none;flex-direction:column;align-items:center;gap:8px;margin:-2px 0 10px}
  .tutextra.show{display:flex}
  .hrow{font-size:1.5rem;letter-spacing:4px}
  .hrow .h{display:inline-block}
  .hrow .h.gone{animation:heartbreak .7s forwards}
  @keyframes heartbreak{35%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(.9);opacity:.2;filter:grayscale(1)}}
  .prow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;opacity:0;transition:opacity .3s}
  .prow.show{opacity:1}
  .pchip{background:var(--panel-2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.8rem;opacity:.45;transition:all .2s}
  .pchip.on{opacity:1;background:var(--panel-3);transform:scale(1.08);box-shadow:0 0 0 2px var(--moon)}
  .tutcap{min-height:4.3em;font-size:1rem;line-height:1.42;color:var(--ink)!important;margin:0 2px 10px!important}
  .tutbar{height:5px;background:var(--panel-2);border-radius:5px;overflow:hidden;margin-bottom:8px}
  .tutbar i{display:block;height:100%;width:0;background:var(--moon)}
  .dots{display:flex;justify-content:center;margin-bottom:8px}
  .dots button{width:22px;height:22px;padding:0;background:transparent;display:grid;place-items:center}
  .dots button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--panel-3);transition:all .2s}
  .dots button.on::before{background:var(--moon);width:18px;border-radius:5px}
  .tutctl{display:flex;gap:8px;align-items:center}
  .tutctl button{min-width:46px;height:46px;padding:0;font-size:1.05rem}
  .tutctl #tutDone{flex:1;padding:0 12px;font-size:.95rem}
  .tutctl button.off{opacity:.4}

  /* ---------- modals ---------- */
  .overlay{position:fixed;inset:0;background:rgba(14,12,28,.74);display:none;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);z-index:10}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:22px;padding:22px 20px;max-width:380px;width:100%;max-height:100%;overflow:auto;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
  .modal h2{margin:0 0 6px;font-size:1.45rem}
  .modal p{margin:0 0 14px;color:var(--muted);line-height:1.45}
  .modal .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .modal .row button{min-height:50px;padding:0 18px;flex:1}
  .primary{background:var(--moon)!important;color:#2b2330}
  .stars{color:var(--moon);font-size:2.4rem;letter-spacing:4px;margin:4px 0 8px}
  .stars .off{opacity:.2}
  .help{text-align:left}
  .help ol{margin:0 0 14px;padding-left:1.2em;color:var(--muted);line-height:1.5}
  .help li{margin-bottom:6px}
  .help b{color:var(--ink)}
  .lvmodal{max-width:460px;text-align:left}
  .lvhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .lvhead h2{margin:0}
  .lvhead button{width:44px;height:44px;padding:0;font-size:1.1rem}
  .band{margin:14px 0 6px;font-weight:800;font-size:.95rem;display:flex;gap:8px;align-items:center}
  .band small{color:var(--muted);font-weight:600}
  .lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
  .lvbtn{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:1.05rem;gap:1px;font-variant-numeric:tabular-nums}
  .lvbtn small{font-size:.6rem;color:var(--moon);letter-spacing:1px}
  .lvbtn.cur{box-shadow:inset 0 0 0 2px var(--moon)}
  .lvbtn.done{background:#3f3770}
  .install{margin:14px 0 4px;text-align:center}
  .install button{width:100%;min-height:50px}
  .install p{margin:8px 0 0!important;font-size:.88rem}
  .freegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .freegrid button{min-height:46px}

  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translate(-50%,-12px);
    background:var(--panel-3);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;font-weight:700;z-index:20;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="catDefs">
    <symbol id="cat" viewBox="0 0 64 64">
      <path d="M9 30 L10 5 L29 17 Z" fill="#2b2330"/>
      <path d="M55 30 L54 5 L35 17 Z" fill="#2b2330"/>

      <path d="M51 24 L50 12 L41 18 Z" fill="#f08aa6"/>
      <ellipse cx="32" cy="38" rx="25" ry="21" fill="#2b2330"/>

<div class="app">
  <header class="top">
    <div class="tl"><button class="icon-btn" id="btnLevels" aria-label="Level map">▦</button><button class="icon-btn" id="btnSound" aria-label="Mute sounds">🔊</button></div>
    <div class="lvl">

      <button class="power" id="pReveal"><span class="inf">∞</span><span class="ico">🐾</span><span class="lbl">Reveal cat</span></button>
      <button class="power" id="pClear"><span class="inf">∞</span><span class="ico">🧽</span><span class="lbl">Clear ✕</span></button>
    </div>
  </div>
</div>

<!-- win -->
<div class="overlay" id="winOverlay"><div class="modal">
  <h2 id="winTitle">Level complete!</h2>
  <div class="stars" id="winStars"></div>
  <p id="winText"></p>
  <div class="row"><button id="btnWinMap">Level map</button><button class="primary" id="btnNext">Next level</button></div>
</div></div>

<!-- hearts -->
<div class="overlay" id="heartOverlay"><div class="modal">
  <h2>Out of hearts 💔</h2>
  <p>No ads, no waiting. Refill and keep going.</p>
  <div class="row"><button id="btnHeartRestart">Restart</button><button class="primary" id="btnRefill">Refill hearts</button></div>
</div></div>

<!-- animated how-to-play -->
<div class="overlay" id="tutOverlay"><div class="modal tutmodal" role="dialog" aria-label="How to play">
  <div class="tuthead"><span class="step" id="tutStep">1/9</span><h2 id="tutTitle"></h2><button id="tutClose" aria-label="Close">✕</button></div>
  <div class="tutstage" id="tutStage">
    <div class="demo" id="tutBoard"></div>
    <div class="finger" id="tutFinger"><span>👆</span></div>
    <div class="tutstart" id="tutStart"><button class="primary" id="tutPlayBig">▶&nbsp; Watch how to play</button></div>
  </div>
  <div class="tutextra" id="tutExtra"></div>
  <p class="tutcap" id="tutCap"></p>
  <div class="tutbar"><i id="tutBar"></i></div>
  <div class="dots" id="tutDots"></div>
  <div class="tutctl">
    <button id="tutPrev" aria-label="Previous">◀</button>
    <button id="tutPlay" aria-label="Pause">❚❚</button>
    <button id="tutNext" aria-label="Next">▶</button>
    <button id="tutVoice" aria-label="Narration on">🗣️</button>
    <button class="primary" id="tutDone">Skip</button>
  </div>
</div></div>

<!-- level map -->
<div class="overlay" id="levelsOverlay"><div class="modal lvmodal">
  <div class="lvhead"><h2>Levels</h2><button id="btnLevelsClose" aria-label="Close">✕</button></div>
  <div id="lvList"></div>
  <div class="install" id="installBox" hidden>
    <button class="primary" id="btnInstall">📲 Install Purrdoku</button>
    <p id="installHint"></p>
  </div>
  <div class="band">Free play <small>random puzzle, no level progress</small></div>
  <div class="freegrid" id="freeGrid"></div>
</div></div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= GEN-START (puzzle generation, no DOM) ================= */
let rand = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const grid = (n, v) => Array.from({ length: n }, () => Array(n).fill(v));
const D4 = [[1,0],[-1,0],[0,1],[0,-1]];

function genSolution(n) {
  const sol = Array(n).fill(-1), used = Array(n).fill(false);
  const go = r => {
    if (r === n) return true;
    for (const c of shuffle([...Array(n).keys()])) {
      if (used[c] || (r > 0 && Math.abs(c - sol[r - 1]) <= 1)) continue;
      used[c] = true; sol[r] = c;
      if (go(r + 1)) return true;
      used[c] = false; sol[r] = -1;
    }
    return false;
  };
  return go(0) ? sol : null;
}

function growRegions(n, sol) {
  const reg = grid(n, -1);
  sol.forEach((c, r) => reg[r][c] = r);
  let left = n * n - n;
  while (left > 0) {
    const opts = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (reg[r][c] < 0) continue;
      for (const [dr, dc] of D4) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nc >= 0 && nr < n && nc < n && reg[nr][nc] < 0) opts.push([nr, nc, reg[r][c]]);
      }
    }
    const [nr, nc, k] = opts[Math.floor(rand() * opts.length)];
    reg[nr][nc] = k; left--;
  }
  return reg;
}

function findSolutions(reg, n, limit) {
  const out = [], cur = Array(n).fill(-1), colU = Array(n).fill(false), regU = Array(n).fill(false);
  const go = r => {
    if (r === n) { out.push(cur.slice()); return out.length >= limit; }
    for (let c = 0; c < n; c++) {
      if (colU[c] || (r > 0 && Math.abs(c - cur[r - 1]) <= 1)) continue;
      const k = reg[r][c];
      if (regU[k]) continue;
      colU[c] = regU[k] = true; cur[r] = c;
      if (go(r + 1)) return true;
      colU[c] = regU[k] = false; cur[r] = -1;
    }
    return false;
  };
  go(0);
  return out;
}

function connectedWithout(reg, n, k, er, ec) {
  const cs = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (reg[r][c] === k && !(r === er && c === ec)) cs.push([r, c]);
  if (cs.length < 2) return false;
  const seen = new Set([cs[0][0] * n + cs[0][1]]), q = [cs[0]];
  while (q.length) {
    const [r, c] = q.pop();
    for (const [dr, dc] of D4) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= n || nc >= n || (nr === er && nc === ec)) continue;
      if (reg[nr][nc] !== k || seen.has(nr * n + nc)) continue;
      seen.add(nr * n + nc); q.push([nr, nc]);
    }
  }
  return seen.size === cs.length;
}

// Nudge region borders until exactly one solution remains.
function repair(reg, n, sol) {
  for (let step = 0; step < 400; step++) {
    const sols = findSolutions(reg, n, 2);
    if (sols.length === 1) return true;
    const alt = sols.find(a => a.some((c, r) => c !== sol[r]));
    const cand = [];
    alt.forEach((c, r) => { if (c !== sol[r]) cand.push([r, c]); });
    shuffle(cand);
    let moved = false;
    for (const [r, c] of cand) {
      const k = reg[r][c], nb = new Set();
      for (const [dr, dc] of D4) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nc >= 0 && nr < n && nc < n && reg[nr][nc] !== k) nb.add(reg[nr][nc]);
      }
      if (!nb.size || !connectedWithout(reg, n, k, r, c)) continue;
      const arr = [...nb];
      reg[r][c] = arr[Math.floor(rand() * arr.length)];
      moved = true; break;
    }
    if (!moved) return false;
  }
  return false;
}

function generate(n) {
  for (let attempt = 0; attempt < 4000; attempt++) {
    const sol = genSolution(n);
    if (!sol) continue;
    const reg = growRegions(n, sol);
    if (!repair(reg, n, sol)) continue;
    const sizes = Array(n).fill(0);
    reg.forEach(row => row.forEach(k => sizes[k]++));
    if (Math.min(...sizes) < 2) continue;
    return { reg, sol };
  }
  return n > 5 ? generate(n - 1) : null;
}

/* Human-style solver: scores how much reasoning a puzzle needs.
   singles (1) < one region locked to a line (3) < two regions locked (6)
   < "if a cat went here, something would be empty" (8) < three regions locked (12). */
function logicSolve(reg, n) {
  const cand = grid(n, true), cat = grid(n, false);
  const rows = [], cols = [], regs = Array.from({ length: n }, () => []);
  for (let r = 0; r < n; r++) { rows.push([]); for (let c = 0; c < n; c++) { rows[r].push([r, c]); regs[reg[r][c]].push([r, c]); } }
  for (let c = 0; c < n; c++) { cols.push([]); for (let r = 0; r < n; r++) cols[c].push([r, c]); }
  const units = rows.concat(cols, regs);
  const kill = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const out = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === r && j === c) continue;
      if (i === r || j === c || reg[i][j] === reg[r][c] || (Math.abs(i - r) <= 1 && Math.abs(j - c) <= 1)) out.push(i * n + j);
    }
    kill.push(out);
  }
  let placed = 0, score = 0;
  const done = u => u.some(([r, c]) => cat[r][c]);
  const live = u => u.filter(([r, c]) => cand[r][c]);
  const place = (r, c) => { cat[r][c] = true; cand[r][c] = false; placed++; for (const k of kill[r * n + c]) cand[(k / n) | 0][k % n] = false; };

  function singles() {
    for (const u of units) {
      if (done(u)) continue;
      const cs = live(u);
      if (cs.length === 0) return 'bad';
      if (cs.length === 1) { place(cs[0][0], cs[0][1]); return true; }
    }
    return false;
  }
  const keyR = (r, c) => r, keyC = (r, c) => c, keyG = (r, c) => reg[r][c];
  const PAIRS = [[regs, keyG, keyR], [regs, keyG, keyC], [rows, keyR, keyG], [cols, keyC, keyG], [rows, keyR, keyC], [cols, keyC, keyR]];
  function combos(arr, k, start, acc, fn) {
    if (acc.length === k) return fn(acc);
    for (let i = start; i < arr.length; i++) { acc.push(arr[i]); if (combos(arr, k, i + 1, acc, fn)) return true; acc.pop(); }
    return false;
  }
  function confine(k) {
    for (const [A, keyA, keyB] of PAIRS) {
      const open = [];
      A.forEach((u, i) => { if (!done(u)) open.push(i); });
      if (open.length <= k) continue;
      const hit = combos(open, k, 0, [], chosen => {
        const union = new Set();
        for (const i of chosen) for (const [r, c] of live(A[i])) { union.add(keyB(r, c)); if (union.size > k) return false; }
        if (union.size !== k) return false;
        const ch = new Set(chosen);
        let changed = false;
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
          if (cand[r][c] && union.has(keyB(r, c)) && !ch.has(keyA(r, c))) { cand[r][c] = false; changed = true; }
        return changed;
      });
      if (hit) return true;
    }
    return false;
  }
  function probe() {
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!cand[r][c]) continue;
      const ks = new Set(kill[r * n + c]);
      for (const u of units) {
        if (done(u) || u.some(([i, j]) => i === r && j === c)) continue;
        if (live(u).every(([i, j]) => ks.has(i * n + j))) { cand[r][c] = false; return true; }
      }
    }
    return false;
  }
  while (placed < n) {
    const s = singles();
    if (s === 'bad') return { solved: false, score: score + 999 };
    if (s) { score += 1; continue; }
    if (confine(1)) { score += 3; continue; }
    if (confine(2)) { score += 6; continue; }
    if (probe())    { score += 8; continue; }
    if (confine(3)) { score += 12; continue; }
    return { solved: false, score: score + 200 };
  }
  return { solved: true, score };
}

/* Level curve: each band has a grid size; inside a band levels go easy -> hard. */
const BANDS = [
  { n: 5, len: 6 },   // 1-6
  { n: 6, len: 8 },   // 7-14
  { n: 7, len: 10 },  // 15-24
  { n: 8, len: 12 },  // 25-36
  { n: 9, len: 14 },  // 37-50
];
const ENDLESS_START = 51, ENDLESS_N = 10;
function levelInfo(L) {
  let start = 1;
  for (const b of BANDS) {
    if (L < start + b.len) {
      const t = (L - start) / (b.len - 1);
      return { n: b.n, t, label: t < 0.34 ? 'Easy' : t < 0.67 ? 'Medium' : 'Hard', bandStart: start, bandEnd: start + b.len - 1 };
    }
    start += b.len;
  }
  const h = mulberry32(L * 7919)();
  return { n: ENDLESS_N, t: 0.7 + 0.3 * h, label: 'Expert', bandStart: ENDLESS_START, bandEnd: Infinity };
}

function pickByDifficulty(n, t, K) {
  const cands = [];
  for (let i = 0; i < K; i++) {
    const p = generate(n);
    if (!p) continue;
    p.d = logicSolve(p.reg, p.reg.length);
    cands.push(p);
  }
  let pool = cands.filter(p => p.d.solved);
  if (!pool.length) pool = cands;
  pool.sort((a, b) => a.d.score - b.d.score);
  return pool[Math.round(t * (pool.length - 1))];
}
const samplesFor = n => n <= 6 ? 16 : n <= 8 ? 12 : n === 9 ? 9 : 4;

// Same level number always gives the same puzzle.
function buildLevel(L) {
  const info = levelInfo(L);
  rand = mulberry32(((L * 2654435761) >>> 0) ^ 0x5eed);
  const p = pickByDifficulty(info.n, info.t, samplesFor(info.n));
  rand = Math.random;
  p.info = info;
  return p;
}
function buildFree(n) {
  rand = Math.random;
  const p = pickByDifficulty(n, 0.5, 5);
  p.info = { n, label: 'Random', free: true };
  return p;
}

    return [cr.left - sr.left + cr.width / 2, cr.top - sr.top + cr.height / 2];
  },
  finger(r, c, fast) {
    const f = $('tutFinger'), [x, y] = T.pos(r, c);
    const tr = `translate(${x - f.offsetWidth * .42}px, ${y - 4}px)`;
    if (f.style.opacity !== '1') { f.style.transition = 'none'; f.style.transform = tr; void f.offsetWidth; f.style.transition = ''; }
    f.classList.toggle('fast', !!fast);
    f.style.transform = tr; f.style.opacity = '1';
  },
  press(r, c, hold) {
    const f = $('tutFinger');
    f.classList.add('press');
    if (!hold) setTimeout(() => f.classList.remove('press'), 140);
    const [x, y] = T.pos(r, c), rp = document.createElement('div');
    rp.className = 'ripple'; rp.style.left = x + 'px'; rp.style.top = y + 'px';
    $('tutStage').appendChild(rp); setTimeout(() => rp.remove(), 550);
  },
  release() { $('tutFinger').classList.remove('press'); },
  hideFinger() { const f = $('tutFinger'); f.style.opacity = '0'; f.classList.remove('press', 'fast'); },
  hop() { $('tutBoard').classList.add('won'); },
  extra(html) { const e = $('tutExtra'); e.innerHTML = html; e.classList.add('show'); },
  loseHeart() { const hs = $('tutExtra').querySelectorAll('.h:not(.gone)'); if (hs.length) hs[hs.length - 1].classList.add('gone'); },
  chip(i) { const cs = $('tutExtra').querySelectorAll('.pchip'); cs.forEach((c, j) => c.classList.toggle('on', j === i)); if (i >= 0) SFX.blip(i + 2); },
};

    steps: [
      ...[0, 1, 2, 3, 4].map(k => [300 + k * 650, () => { T.hl(regionOf(k)); SFX.blip(k); }]),
      [3700, () => T.hl(regionOf(2))], [4200, () => T.cat(2, 0)],
      ...[[2, 1], [3, 0], [4, 0], [4, 1]].map(([r, c], i) => [4800 + i * 180, () => T.x(r, c, i)]),

  { title: 'One cat per row', dur: 4400,

  { title: 'One cat per column', dur: 4400,

      ...[0, 1, 2, 4].map((r, i) => [1600 + i * 180, () => T.x(r, 2, i)]), [3300, () => T.unhl()]] },
  { title: 'No touching', dur: 5000,

    steps: [[300, () => T.cat(1, 3)],
      [1100, () => { T.hl([[0, 2], [0, 3], [0, 4], [1, 2], [1, 4], [2, 2], [2, 3], [2, 4]], 'bad'); SFX.warn(); }],
      ...[[0, 2], [0, 3], [0, 4], [1, 4], [2, 4], [2, 3], [2, 2], [1, 2]].map(([r, c], i) => [2600 + i * 110, () => T.x(r, c, i)]),
      [3900, () => T.unhl()]] },
  { title: 'Mark with ✕', dur: 6000,
    text: 'Tap a square to mark ✕ where a cat can’t be. Drag to mark lots at once, and tap a ✕ again to erase it.',
    say: 'Tap a square to mark an X where a cat can’t be. Drag to mark lots at once, and tap an X again to erase it.',
    steps: [[300, () => T.finger(0, 4)], [1000, () => { T.press(0, 4); T.x(0, 4); }],
      [1800, () => T.finger(4, 0)], [2400, () => { T.press(4, 0, true); T.x(4, 0, 0); }],
      [2550, () => T.finger(4, 1, true)], [2700, () => T.x(4, 1, 1)],
      [2850, () => T.finger(4, 2, true)], [3000, () => T.x(4, 2, 2)],
      [3150, () => T.finger(4, 3, true)], [3300, () => T.x(4, 3, 3)],
      [3500, () => T.release()], [3700, () => T.finger(0, 4)], [4400, () => { T.press(0, 4); T.unx(0, 4); }],
      [5300, () => T.hideFinger()]] },
  { title: 'Place a cat', dur: 5600,
    text: 'Double-tap to place a cat. Everything it rules out is crossed out for you. Prefer one tap? Switch to “Tap places”.',
    say: 'Double-tap to place a cat. Everything it rules out is crossed out for you. Prefer one tap? Switch to tap places.',

      [2700, () => T.finger(1, 3)], [3400, () => T.press(1, 3)], [3600, () => T.press(1, 3)], [3650, () => T.cat(1, 3)],
      [4900, () => T.hideFinger()]] },

        ['↩️ Undo', '✨ Cross out 3', '🐾 Reveal cat', '🧽 Clear ✕'].map(x => `<span class="pchip">${x}</span>`).join('') + '</div>');

let voice = null;
function pickVoice() {
  if (voice || !canSpeak) return voice;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pref = ['Samantha', 'Google US English', 'Aria', 'Jenny', 'Zira', 'Karen', 'Moira', 'Female'];
  voice = vs.find(v => pref.some(p => v.name.includes(p))) || vs[0] || null;
  return voice;
}
if (canSpeak) speechSynthesis.onvoiceschanged = () => { voice = null; pickVoice(); };
function speak(text, done) {
  if (!canSpeak || !tut.narrate || !SFX.on) { done(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02; u.pitch = 1.2; u.lang = 'en-US';
  const v = pickVoice(); if (v) u.voice = v;
  let fired = false; const fin = () => { if (!fired) { fired = true; done(); } };
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}

function tutClear() {
  tut.timers.forEach(clearTimeout); tut.timers = []; tut.gen++;
  if (canSpeak) speechSynthesis.cancel();
  if (TB) T.hideFinger();
  document.querySelectorAll('#tutStage .ripple').forEach(e => e.remove());
}
function tutAt(ms, fn) { const g = tut.gen; tut.timers.push(setTimeout(() => { if (g === tut.gen) fn(); }, ms)); }
function tutChrome() {
  const s = SLIDES[tut.i], last = tut.i === SLIDES.length - 1;
  $('tutStep').textContent = `${tut.i + 1}/${SLIDES.length}`;
  $('tutTitle').textContent = s.title;
  $('tutCap').textContent = s.text;
  $('tutPrev').disabled = tut.i === 0;
  $('tutNext').disabled = last;
  $('tutDone').textContent = last ? 'Let’s play!' : 'Skip';
  $('tutPlay').textContent = tut.playing ? '❚❚' : '▶';
  $('tutPlay').setAttribute('aria-label', tut.playing ? 'Pause' : 'Play');
  $('tutVoice').hidden = !canSpeak;
  $('tutVoice').classList.toggle('off', !tut.narrate);
  $('tutVoice').setAttribute('aria-label', tut.narrate ? 'Narration on' : 'Narration off');
  [...$('tutDots').children].forEach((d, j) => d.classList.toggle('on', j === tut.i));
}
function tutShow(i, play) {
  tutClear();
  tut.i = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[tut.i];
  tbReset();
  $('tutExtra').classList.remove('show'); $('tutExtra').innerHTML = '';
  if (s.setup) s.setup();
  tut.playing = play;
  tutChrome();
  $('tutStart').classList.toggle('show', !play);
  const bar = $('tutBar');
  bar.style.transition = 'none'; bar.style.width = '0%';
  if (!play) { if (s.poster) s.poster(); return; }
  void bar.offsetWidth;
  bar.style.transition = `width ${s.dur}ms linear`; bar.style.width = '100%';
  let tDone = false, sDone = false, fired = false;
  const g = tut.gen;
  const next = () => {
    if (fired || !tDone || !sDone) return;
    fired = true;
    tutAt(900, () => {
      if (tut.i < SLIDES.length - 1) tutShow(tut.i + 1, true);
      else { tut.playing = false; tutChrome(); }
    });
  };
  s.steps.forEach(([ms, fn]) => tutAt(ms, fn));
  tutAt(s.dur, () => { tDone = true; next(); });
  tutAt(s.dur + 9000, () => { sDone = true; next(); });
  speak(s.say || s.text, () => { if (g === tut.gen) { sDone = true; next(); } });
}
function openTutorial(autoplay) {
  $('tutOverlay').classList.add('show'); timerStop();
  if (autoplay) SFX.pop();
  tutShow(0, autoplay);
}
function closeTutorial() {
  tutClear(); tut.playing = false;
  store('purrdoku_seentut', 1);
  closeModal('tutOverlay');
}
SLIDES.forEach((s, j) => {
  const d = document.createElement('button');
  d.setAttribute('aria-label', `Step ${j + 1}: ${s.title}`);
  d.onclick = () => { SFX.tap(); tutShow(j, true); };
  $('tutDots').appendChild(d);
});
$('tutPlayBig').onclick = () => { SFX.unlock(); tutShow(tut.i, true); };
$('tutPlay').onclick = () => {
  if (tut.playing) { tutClear(); tut.playing = false; tutChrome(); SFX.tap(); }
  else tutShow(tut.i, true);
};
$('tutPrev').onclick = () => { SFX.tap(); tutShow(tut.i - 1, true); };
$('tutNext').onclick = () => { SFX.tap(); tutShow(tut.i + 1, true); };
$('tutVoice').onclick = () => {
  tut.narrate = !tut.narrate; store('purrdoku_narrate', tut.narrate); SFX.tap();
  if (!tut.narrate && canSpeak) speechSynthesis.cancel();
  tutChrome();
};
$('tutDone').onclick = () => closeTutorial();
$('tutClose').onclick = () => closeTutorial();


/* ---------- install as an app + offline ---------- */
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEvt = null;
function paintInstall() {
  const box = $('installBox'), btn = $('btnInstall'), hint = $('installHint');
  if (standalone || window.Capacitor || location.protocol === 'file:') { box.hidden = true; return; }
  if (installEvt) { box.hidden = false; btn.hidden = false; hint.textContent = 'Adds it to your home screen. Plays offline.'; }
  else if (isIOS) { box.hidden = false; btn.hidden = true; hint.innerHTML = 'To install: tap <b>Share</b> ⬆️ in Safari, then <b>Add to Home Screen</b>.'; }
  else box.hidden = true;
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; paintInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; paintInstall(); toast('Installed! Find Purrdoku on your home screen 🐱', 2600); });
$('btnInstall').onclick = async () => {
  if (!installEvt) return;
  SFX.tap(); installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; paintInstall();
};
if ('serviceWorker' in navigator && !window.Capacitor && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* pause when the app goes to background; save progress */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { timerStop(); saveGame(); if (tut.playing) { tutClear(); tut.playing = false; tutChrome(); } } else resume();
});
window.addEventListener('pagehide', saveGame);

/* ---------- boot ---------- */
const saved = load('purrdoku_game2', null);
if (saved && saved.reg && saved.sol && saved.info) {
  setPuzzle({ reg: saved.reg, sol: saved.sol, info: saved.info }, saved.mode, saved.level, saved);
} else {
  startLevel(Math.min(prog.current || 1, prog.unlocked));
}
if (!load('purrdoku_seentut', 0)) openTutorial(false);
})();
